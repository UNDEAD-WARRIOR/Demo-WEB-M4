<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="./output.css" rel="stylesheet" />
    <title>The Vibe Grid | FlipPlay</title>
  </head>
  <body class="min-h-screen font-body text-mist antialiased">
    <header class="sticky top-0 z-20 border-b border-white/10 bg-plum/70 backdrop-blur-xl">
      <nav class="mx-auto flex max-w-6xl flex-wrap items-center justify-between px-6 py-4" aria-label="Navigasi utama">
        <a href="index.html" class="flex items-center gap-2 font-display text-2xl font-extrabold">
          <span class="grid h-8 w-8 place-items-center rounded-lg bg-gradient-to-br from-coral to-amber text-lg text-plum" aria-hidden="true">&#9654;</span>
          <span class="text-gradient">FlipPlay</span>
        </a>
        <button id="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-menu" class="glass rounded-full px-4 py-2 text-sm font-medium md:hidden">Menu</button>
        <ul id="nav-menu" class="hidden w-full flex-col gap-1 pt-4 md:flex md:w-auto md:flex-row md:gap-8 md:pt-0">
          <li><a href="index.html"  class="nav-link">Beranda</a></li>
          <li><a href="vibe-grid.html" aria-current="page" class="nav-link">Vibe Grid</a></li>
          <li><a href="index.html#kontak" class="nav-link">Kontak</a></li>
        </ul>
      </nav>
    </header>
    <main class="mx-auto max-w-6xl px-6 py-12">
      <h1 class="font-display text-5xl font-extrabold leading-none md:text-7xl"><span class="text-gradient">The Vibe Grid</span></h1>
      <p class="mt-4 max-w-xl text-lg text-mist/70">Cari judul atau pilih suasana hatimu, lalu temukan anime yang cocok.</p>

      <section aria-label="Pencarian dan filter" class="glass mt-10 space-y-5 rounded-2xl p-5 md:p-6">
        <div class="relative md:max-w-lg">
          <label for="search-input" class="sr-only">Cari judul</label>
          <svg class="pointer-events-none absolute left-4 top-1/2 h-5 w-5 -translate-y-1/2 text-mist/50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search-input" type="search" placeholder="Cari judul anime..." autocomplete="off" class="field pl-12" />
        </div>
        <div id="aura-buttons" class="flex flex-wrap gap-2.5" role="group" aria-label="Pilih aura"></div>
        <div class="flex flex-wrap items-center justify-between gap-2 text-sm">
          <p id="aura-hint" class="text-mist/70"></p>
          <p class="text-mist/50"><span id="result-count" class="font-semibold text-amber"></span> <span id="source-info"></span></p>
        </div>
      </section>

      <p id="loading-message" class="mt-8 text-amber" role="status"></p>
      <div id="error-box" class="mt-8 hidden rounded-2xl border border-coral bg-coral/15 p-5" role="alert">
        <p id="error-message"></p>
        <button id="retry-btn" type="button" class="btn-primary mt-4 !py-2">Muat ulang data</button>
      </div>

      <section id="media-grid" aria-label="Daftar anime" class="mt-6 grid grid-cols-2 gap-4 sm:gap-5 md:grid-cols-3 lg:grid-cols-4"></section>
    </main>
    <footer class="border-t border-white/10 px-6 py-8 text-center text-sm text-mist/60">
      <p>&copy; 2026 FlipPlay. Praktikum Pemrograman Web, UMM.</p>
    </footer>
    <script src="js/script.js" defer></script>
  </body>
</html>
